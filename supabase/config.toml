# Supabase local development configuration.
# Hosted settings that MUST match (set in Dashboard → Authentication):
#   * JWT expiry: 1800 seconds (30 min). Short-lived JWTs + server-side
#     refresh revocation = role revocation takes effect within one window.
#   * Refresh token rotation: enabled, reuse detection on.
#   * Email confirmations: required.
#   * MFA: TOTP enabled; WebAuthn factor enabled (beta) for privileged
#     accounts. The Owner account must never have an email-only recovery
#     path — enforce via MFA enrollment before any role is granted.

project_id = "herciety"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 200

[db]
port = 54322
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:3000"
# herciety.com is canonical; unitedfeminist.com is the secondary company
# domain and redirects to it, so both stay on the auth allow-list.
additional_redirect_urls = ["https://herciety.com", "https://unitedfeminist.com"]
# Short-lived JWTs (E2E-readiness decision #5 / instant role revocation).
jwt_expiry = 1800
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# WebAuthn factor (beta in hosted Supabase) — enable in the dashboard
# when available on the project's plan; TOTP is the stable fallback and
# both satisfy the AAL2 step-up the SECURITY DEFINER functions require.

[studio]
enabled = true
port = 54323
